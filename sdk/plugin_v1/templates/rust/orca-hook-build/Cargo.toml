[package]
name = "orca-hook-build"
version = "0.1.0"
edition = "2021"
description = "Build helper — emits PE resource / ELF note with plugin metadata and C exports"
license = "AGPL-3.0"

[lib]
name = "orca_hook_build"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
